# Hermes Skill Lens — embedded CORE rule pack v0.1 (SPEC §15).
#
# Ships in-repo, travels version-pinned with the plugin via git tags
# (D-RULEOWN). Loads offline from package data; zero network. Semver is
# YYYY.MM.N: new rule = patch bump, weight/severity change = minor bump +
# changelog rationale, IR/schema break = major bump.
name: core
version: "2026.08.9"
spec_version: rule-pack/1
description: >-
  Core detection pack v0.1 for Hermes Skill Lens: forty-four rules across the
  eight Phase-1/1.5 engines (E1 manifest, E2 textinject, E3 shellscan, E4
  pyscan, E5 jsscan, E6 netgraph, E7 secretscan, E8 depintel) plus the
  claims-stage vague-description rule, selected from the SPEC §17
  Hermes-precedent threat matrix. Every rule ships with >=1 true-positive
  golden fixture and >=1 benign lookalike negative fixture under
  corpus/fixtures/.
rules_dir: rules
changelog:
  - version: "2026.08.9"
    date: "2026-08-28"
    rationale: >-
      Widen LNS-PYS-004 and LNS-JSS-004 to cross-file import-edge taint
      (same-bundle, same-language, direct import edge — sink imports source);
      new evidence token family xf-flow:<source_kind>:<sink_short>:<src_path>><sink_path>
      with confidence 0.80, tag cross-file-flow, static_only false, AST-only
      (degraded lane unchanged per D-039 parity). No new rule ids, no material
      (severity/weight/capability/engine/evidence_kind/confidence_default)
      changes; vectors byte-exact, existing fixtures byte-identical.
    notes:
      - "Cross-file taint v1.0 per cross-file-taint.md §13: E4 sources→E4 sinks, E5→E5 only;"
      - "direct import edge is the bar (E4: import/from-import resolving to .py path; E5:"
      - "require/import resolving to sibling .js path); plain co-presence and"
      - "cross-language co-presence never fire (D-024 FP filter; consumer-intent"
      - "stays with the LLM layer)."
      - "Detection-widening of LNS-PYS-004/JSS-004 (D-063 precedent): xf-flow token"
      - "never collapses against same-file sensitive-flow; line-shift stable per"
      - "file; findings sorted by (rule_id, path, start_line) with sink as"
      - "primary location and source attached to locations[]."
      - "Fixtures: malicious py-split-exfil (helpers/grab.py→scripts/run_report.py)"
      - "and js-split-beacon (lib/envcollect.js→index.js) fire HIGH via xf-flow;"
      - "benign split-modules-reporter (co-presence no edge), declared-split-uploader"
      - "(import edge no source), cross-lang-co-presence (py env + js fetch) stay"
      - "silent (grade ≥ B, FP=0)."
  - version: "2026.08.8"
    date: "2026-08-28"
    rationale: >-
      Close the D-046 detection gaps with zero material changes: E6 gains a
      bounded multi-line send-sink window (LNS-NET-011 tier 2) and E5 gains
      bare-call Function(...) detection in both lanes (LNS-JSS-001).
    notes:
      - "D-046 gap (a): E6 netgraph LNS-NET-011 adds an additive bounded"
      - "multi-line send-sink window (8 lines / 400 chars hard caps) behind"
      - "the untouched per-line tier 1 — a multi-line fetch with method: POST"
      - "+ body: now pairs with same-file credential sources; curl/wget"
      - "backslash continuations fold the same way. Necessary-condition gates"
      - "(D-049/D-056/D-061) intact; vectors A-G byte-exact."
      - "D-046 gap (b): E5 jsscan LNS-JSS-001 fires on bare-call Function(x)"
      - "in BOTH lanes (AST identifier-callee branch; degraded regex with the"
      - "same (?<![\\w.$]) guard and quoted-literal carve-out), evidence"
      - "token function-constructor unchanged so fingerprints match across"
      - "modes; new Function, member access, and literal-only bodies stay"
      - "silent. No new rules; no material (severity/weight/capability/engine/"
      - "evidence_kind/confidence_default) changes. Fixtures: malicious"
      - "multiline-fetch-exfil + bare-function-loader, benign"
      - "build-metrics-poster + literal-function-helper."
