    date: "2026-08-25"
    notes:
      - "Add LNS-MAN-004 vague-description rule (SPEC §9.2; D-020)."
      - "Fixtures: vague-workflow-booster + workflow-notes-helper."
  - version: "2026.08.1"
    date: "2026-08-25"
    notes:
      - "Initial core pack v0.1: 16 active rules across E1/E3/E6/E7."
      - "LNS-NET-011 title/capability anchored to SPEC §7 worked finding."
      - "Severity calibration per SPEC §17 detection-shape notes (H1-H9)."
