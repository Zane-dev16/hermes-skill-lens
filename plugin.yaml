# Hermes Skill Lens — plugin manifest (v2).
---
#
# Field names are exactly the known fields of hermes_cli/plugins.py
# (_KNOWN_MANIFEST_FIELDS, lines ~656-668; SUPPORTED_MANIFEST_VERSION = 2).
# Unknown fields warn-and-continue on the host; we ship known fields only.
#
# NOTE ON NAME VS KEY: for flat directory plugins the host derives the
# registry key from the manifest `name` (see PluginManager._parse_manifest:
# `key = f"{prefix}/{plugin_dir.name}" if prefix else name`). The key drives
# `plugins.enabled`, the `plugins.entries.<key>.settings.*` config namespace,
# and the plugin-data directory — SPEC §10 mandates those namespaces as
# `plugins.entries.lens.settings.*`, so `name` here MUST stay `lens`.
# The human-facing brand ("Skill Lens") lives in description/tags/homepage.
name: lens
manifest_version: 2
api_version: 1
version: "0.9.0a0"
description: >-
  Skill Lens ("A lens, not a bouncer.") — advisor-only security scanner for
  agent skill bundles. Deterministic claimed-vs-actual capability diff with
  evidence-cited findings and a recomputable trust score. Registers observer
  hooks only (on_skill_lifecycle, post_tool_call, transform_tool_result);
  never blocks an install, never opens a network socket, never requires an
  LLM in its default path.
author: "Irell Zane"
license: MIT
homepage: https://github.com/Zane-dev16/hermes-skill-lens
tags:
  - security
  - skills
  - static-analysis
  - deterministic
  - advisor
provides_hooks:
  - on_skill_lifecycle
  - post_tool_call
  - transform_tool_result
# Declaration seam ONLY (host validates + warns, never auto-installs —
# hermes_cli/plugins.py::_warn_python_dependencies lines 4679-4720, invoked
# at :4027; SPEC D-PARSE). PyYAML backs SKILL.md frontmatter parsing in
# skill_lens.ingest. tree-sitter backs the AST engines' grammar lane
# (Phase 1.5); a host without them degrades to the golden-tested
# line-scanner fallback (skill_lens.parsing.ParserGateway), and repo-
# vendored wheels under wheels/ are the second-chance lane.
python_dependencies:
  - PyYAML
  - tree-sitter>=0.24,<0.27
  - tree-sitter-python>=0.23,<0.26
  - tree-sitter-javascript>=0.23,<0.26
  - tree-sitter-bash>=0.23,<0.26
  # Phase 5 (SPEC §15): ed25519 verification of the core-pack signature
  # (doctor check 1 + `rules verify`) — OFFLINE crypto only, never network.
  # Declaration seam only (host validates + warns); without any backend the
  # doctor degrades to an honest WARN and tamper still fails on checksum
  # comparison. PyNaCl is an accepted fallback backend; cryptography is the
  # declared primary (DECISIONS D-055).
  - cryptography>=42
