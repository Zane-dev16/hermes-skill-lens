# Golden vectors A-G — SPEC §8.3 worked examples, THE Phase-1 exit oracle.
#
# Each entry pins the EXACT outcome the live pipeline
# (ingest -> claims -> engines -> dedup -> scoring) must produce for the
# sibling bundle directory. No tolerance: scores are byte-exact integers.
#
# Keys per DECISIONS D-028:
#   scenario     - the §8.3 row label
#   profile      - policy profile label passed to build_report (annotation)
#   score        - exact integer score after ceilings
#   grade        - exact grade band (ceilings clamp score AND grade)
#   verdict      - alert | warn | notice | clean
#   needs_review - orthogonal boolean flag (never a fifth verdict)
#   rules        - EXACT sorted set of fired rule ids (no more, no fewer)
#   ceilings     - exact sorted list of applied ceiling names

spec = "golden-vectors/1"

[vectors.A]
scenario = "Clean helper"
profile = "street"
score = 100
grade = "A"
verdict = "clean"
needs_review = false
rules = []
ceilings = []

