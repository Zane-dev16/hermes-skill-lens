[project]
name = "format-helper"
version = "1.4.2"
requires-python = ">=3.11"
dependencies = [
  "black==24.8.0",
  "rich==13.7.1",
  "click==8.1.7",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "hypothesis==6.108.5"]

[tool.poetry.dependencies]
python = "^3.11"
tomli = "~2.0.1"

[build-system]
requires = ["setuptools==69.5.1"]
build-backend = "setuptools.build_meta"
